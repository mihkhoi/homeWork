<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="utf-8" />
        <title>Chi tiết đơn hàng</title>
        <link rel="stylesheet" href="/css/app.css" />
    </head>
    <body>
        <header class="topbar">
            <div class="container topbar__inner">
                <a class="brand" href="/">ShopContract</a>
                <nav class="nav">
                    <a href="/products">Sản phẩm</a>
                    <a href="/cart">Giỏ hàng</a>
                    <a href="/orders">Đơn hàng</a>
                    <a href="/logout">Đăng xuất</a>
                </nav>
            </div>
        </header>

        <main class="container">
            <h1>Chi tiết đơn hàng</h1>

            <div class="card" style="margin-bottom: 16px">
                <p>
                    <strong>Mã đơn:</strong> <span th:text="${order.id}"></span>
                </p>
                <p>
                    <strong>Địa chỉ:</strong>
                    <span th:text="${order.address}"></span>
                </p>
                <p>
                    <strong>Ngày tạo:</strong>
                    <span th:text="${order.createdAt}"></span>
                </p>
                <p>
                    <strong>Trạng thái:</strong>
                    <span class="badge" th:text="${order.status}"></span>
                </p>
                <p>
                    <strong>Phương thức:</strong>
                    <span th:text="${order.paymentMethod}"></span>
                </p>
                <p>
                    <strong>Phí ship:</strong>
                    <span
                        th:text="${#numbers.formatInteger(order.shippingFee,0,'COMMA')}"
                    ></span>
                    VND
                </p>
                <p th:if="${order.voucherCode != null}">
                    <strong>Voucher:</strong>
                    <span th:text="${order.voucherCode}"></span>
                </p>
                <p th:if="${order.discountAmount > 0}">
                    <strong>Giảm giá:</strong>
                    <span
                        th:text="${#numbers.formatInteger(order.discountAmount,0,'COMMA')}"
                    ></span>
                    VND
                </p>
                <p>
                    <strong>Tổng tiền:</strong>
                    <span
                        th:text="${#numbers.formatInteger(order.total,0,'COMMA')}"
                    ></span>
                    VND
                </p>
            </div>

            <table class="table">
                <thead>
                    <tr>
                        <th>Sản phẩm</th>
                        <th>Đơn giá</th>
                        <th>Số lượng</th>
                        <th>Tạm tính</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="l : ${lines}">
                        <td>
                            <div
                                style="font-weight: 800"
                                th:text="${l.name}"
                            ></div>
                            <div class="muted">
                                Mã SP: <span th:text="${l.productId}"></span>
                            </div>
                        </td>
                        <td>
                            <span
                                th:text="${#numbers.formatInteger(l.price,0,'COMMA')}"
                            ></span>
                            VND
                        </td>
                        <td th:text="${l.qty}"></td>
                        <td>
                            <span
                                th:text="${#numbers.formatInteger(l.subtotal,0,'COMMA')}"
                            ></span>
                            VND
                        </td>
                    </tr>
                </tbody>
            </table>
        </main>

        <footer class="footer">
            <div class="container footer__inner">
                <small>© 2026 ShopContract</small>
            </div>
        </footer>
    </body>
</html>
