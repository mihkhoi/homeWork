<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="utf-8" />
        <title>Register</title>
        <link rel="stylesheet" href="/css/app.css" />
    </head>
    <body>
        <header class="topbar">
            <div class="container topbar__inner">
                <a class="brand" href="/">ShopContract</a>
                <nav class="nav">
                    <a href="/products">Sản phẩm</a>
                    <a href="/cart">Giỏ hàng</a>
                    <a href="/register">Đăng ký</a>
                    <a href="/login">Đăng nhập</a>
                </nav>
            </div>
        </header>

        <main class="container">
            <div class="card" style="max-width: 560px; margin: 0 auto">
                <h1 style="margin-top: 0">Đăng ký tài khoản</h1>

                <p
                    th:if="${error}"
                    style="color: #ff4d4f; font-weight: 700"
                    th:text="${error}"
                ></p>

                <form method="post" action="/register" th:object="${form}">
                    <div style="margin-bottom: 12px">
                        <label>Họ và tên</label>
                        <input
                            type="text"
                            th:field="*{fullName}"
                            placeholder="Nguyễn Văn A"
                        />
                    </div>

                    <div style="margin-bottom: 12px">
                        <label>Email</label>
                        <input
                            type="text"
                            th:field="*{email}"
                            placeholder="abc@gmail.com"
                        />
                    </div>

                    <div style="margin-bottom: 12px">
                        <label>Password</label>
                        <input
                            type="password"
                            th:field="*{password}"
                            placeholder="Tối thiểu 6 ký tự"
                        />
                    </div>

                    <div style="margin-bottom: 12px">
                        <label>Số điện thoại</label>
                        <input
                            type="text"
                            th:field="*{phone}"
                            placeholder="0901234567"
                        />
                    </div>

                    <div style="margin-bottom: 12px">
                        <label>Địa chỉ</label>
                        <input
                            type="text"
                            th:field="*{address}"
                            placeholder="123 Lê Lợi, Quận 1"
                        />
                    </div>

                    <button class="btn" type="submit">Đăng ký</button>
                </form>
            </div>
        </main>

        <footer class="footer">
            <div class="container footer__inner">
                <small>© 2026 ShopContract</small>
            </div>
        </footer>
    </body>
</html>
