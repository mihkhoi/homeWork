<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="utf-8" />
        <title>Login</title>
        <link rel="stylesheet" href="/css/app.css" />
    </head>
    <body>
        <header class="topbar">
            <div class="container topbar__inner">
                <a class="brand" href="/">ShopContract</a>
                <nav class="nav">
                    <a href="/products">Sản phẩm</a>
                    <a href="/cart">Giỏ hàng</a>
                    <a href="/register">Đăng ký</a>
                    <a href="/login">Đăng nhập</a>
                </nav>
            </div>
        </header>

        <main class="container">
            <div class="card" style="max-width: 520px; margin: 0 auto">
                <h1 style="margin-top: 0">Đăng nhập</h1>
                <p class="muted">Đăng nhập người dùng hoặc admin.</p>

                <div
                    class="card"
                    style="margin-bottom: 12px; background: #fff7f5"
                >
                    <div><strong>User demo:</strong> tự đăng ký</div>
                    <div>
                        <strong>Admin demo:</strong> admin@shop.com / admin123
                    </div>
                </div>

                <p
                    th:if="${error}"
                    style="color: #ff4d4f; font-weight: 700"
                    th:text="${error}"
                ></p>

                <form method="post" action="/login" th:object="${form}">
                    <div style="margin-bottom: 12px">
                        <label>Email</label>
                        <input
                            type="text"
                            th:field="*{email}"
                            placeholder="abc@gmail.com"
                        />
                    </div>

                    <div style="margin-bottom: 12px">
                        <label>Password</label>
                        <input
                            type="password"
                            th:field="*{password}"
                            placeholder="Nhập mật khẩu"
                        />
                    </div>

                    <button class="btn" type="submit">Đăng nhập</button>
                </form>
            </div>
        </main>

        <footer class="footer">
            <div class="container footer__inner">
                <small>© 2026 ShopContract</small>
            </div>
        </footer>
    </body>
</html>
