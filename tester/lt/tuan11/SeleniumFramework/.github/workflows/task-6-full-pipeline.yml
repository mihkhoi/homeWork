name: Task 6 - Full CI Pipeline with Allure → GitHub Pages

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 2 * * 1-5" # 2:00 AM Mon-Fri
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        browser: [chrome, firefox]
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Run tests on ${{ matrix.browser }}
        run: |
          mvn clean test \
            -Dbrowser=${{ matrix.browser }} \
            -Denv=dev \
            -DsuiteXmlFile=testng-smoke.xml
        env:
          CI: true
          APP_USERNAME: ${{ secrets.SAUCEDEMO_USERNAME }}
          APP_PASSWORD: ${{ secrets.SAUCEDEMO_PASSWORD }}

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ matrix.browser }}
          path: target/allure-results/
          retention-days: 30

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-${{ matrix.browser }}
          path: |
            target/surefire-reports/
            target/screenshots/
          retention-days: 30

  publish-report:
    needs: test
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Download all Allure results
        uses: actions/download-artifact@v4
        with:
          path: allure-results-temp

      - name: Merge Allure results
        run: |
          mkdir -p allure-results
          # Combine all allure results from different artifacts
          find allure-results-temp -name "allure-results-*" -type d | while read dir; do
            cp -r "$dir"/allure-results/* allure-results/ 2>/dev/null || true
          done
          ls -la allure-results/ || echo "No allure-results found"

      - name: Generate Allure Report
        uses: simple-elf/allure-report-action@master
        if: always()
        with:
          allure_results: allure-results
          allure_history: allure-history
          keep_reports: 20

      - name: Deploy report to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: allure-report
          destination_dir: reports

  notify:
    needs: [test, publish-report]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Test Summary
        run: |
          echo "## ✅ CI Pipeline Completed"
          echo ""
          echo "- Tests: ${{ needs.test.result }}"
          echo "- Report Published: ${{ needs.publish-report.result }}"
          echo ""
          echo "📊 View full Allure Report: https://$(echo $GITHUB_REPOSITORY | cut -d/ -f1).github.io/$(echo $GITHUB_REPOSITORY | cut -d/ -f2)/reports/"
